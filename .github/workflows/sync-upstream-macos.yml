name: Sync upstream and release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: crmne/fastpotify
  CARGO_TERM_COLOR: always

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.sync.outputs.release }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if ! git merge --no-commit --no-ff upstream/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"

              if [[ "$conflicts" != "flake.nix" ]]; then
                echo "::error::Upstream merge has conflicts that require manual resolution:"
                printf '%s\n' "$conflicts"
                git merge --abort
                exit 1
              fi

              ours="$(mktemp)"
              theirs="$(mktemp)"
              ours_normalized="$(mktemp)"
              theirs_normalized="$(mktemp)"
              trap 'rm -f "$ours" "$theirs" "$ours_normalized" "$theirs_normalized"' EXIT

              git show :2:flake.nix > "$ours"
              git show :3:flake.nix > "$theirs"
              sed -E 's#hash = "sha256-[^"]+";#hash = "__VENDOR_HASH__";#' "$ours" > "$ours_normalized"
              sed -E 's#hash = "sha256-[^"]+";#hash = "__VENDOR_HASH__";#' "$theirs" > "$theirs_normalized"

              if ! cmp -s "$ours_normalized" "$theirs_normalized"; then
                echo "::error::flake.nix differs beyond the Nix vendor hash; refusing automatic resolution."
                git merge --abort
                exit 1
              fi

              echo "flake.nix conflicts only in the Nix vendor hash; keeping the proxy fork value."
              git checkout --ours -- flake.nix
              git add flake.nix
            fi

            git restore --source=HEAD --staged --worktree -- .github/workflows

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved merge conflicts remain."
              git merge --abort
              exit 1
            fi

            git commit --no-edit
          fi

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to read package version from Cargo.toml"
            exit 1
          fi
          tag="v${version}"
          head_sha="$(git rev-parse HEAD)"

          git push origin HEAD:main

          mac="fastpotify-proxy-${tag}-macos-universal.dmg"
          win="fastpotify-proxy-${tag}-windows-x64.zip"
          deb="fastpotify-proxy-${tag}-linux-x64.deb"
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"

          release_complete=false
          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -Fxq "$mac" <<< "$assets" \
              && grep -Fxq "$win" <<< "$assets" \
              && grep -Fxq "$deb" <<< "$assets"; then
              release_complete=true
            fi
          fi

          if [[ "$tag_sha" == "$head_sha" && "$release_complete" == true ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$tag_sha" ]]; then
            git tag -f "$tag" HEAD
            git push --force origin "refs/tags/$tag"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: Fastpotify Proxy · macOS universal
    needs: sync
    if: needs.sync.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: proxy-macos-universal
      - name: Prepare Fastpotify Proxy runtime identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/single_instance.rs")
          text = path.read_text()
          old = "const INSTANCE_PORT: u16 = 47_113;"
          new = "const INSTANCE_PORT: u16 = 47_114;"
          if old not in text:
              raise SystemExit("expected Fastpotify single-instance port marker was not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build Fastpotify Proxy universal app
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p universal dist
          lipo -create \
            target/aarch64-apple-darwin/release/fastpotify \
            target/x86_64-apple-darwin/release/fastpotify \
            -output universal/fastpotify

          strings universal/fastpotify > "$RUNNER_TEMP/fastpotify-proxy-strings.txt"
          if ! grep -Fq "HTTP proxy server" "$RUNNER_TEMP/fastpotify-proxy-strings.txt" \
            || ! grep -Fq "Proxy status" "$RUNNER_TEMP/fastpotify-proxy-strings.txt"; then
            echo "::error::Built macOS binary is missing the Proxy settings GUI markers."
            exit 1
          fi

          version="${{ needs.sync.outputs.tag }}"
          version="${version#v}"
          bash packaging/macos/bundle.sh universal/fastpotify "Fastpotify Proxy.app" "$version"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'Fastpotify Proxy.app/Contents/Info.plist')"
          if [[ "$bundle_id" != "com.othinusg.fastpotify.proxy" ]]; then
            echo "::error::Unexpected Fastpotify Proxy bundle identifier: $bundle_id"
            exit 1
          fi
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R "Fastpotify Proxy.app" "$stage/"
          cp README.md LICENSE "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Fastpotify Proxy" -srcfolder "$stage" -ov \
            -format UDZO "dist/fastpotify-proxy-${{ needs.sync.outputs.tag }}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: fastpotify-proxy-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Fastpotify Proxy · Windows x64
    needs: sync
    if: needs.sync.outputs.release == 'true'
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: proxy-windows-x64
      - name: Prepare Fastpotify Proxy runtime identity
        shell: pwsh
        run: |
          $path = "src\single_instance.rs"
          $text = [IO.File]::ReadAllText($path)
          $old = "const INSTANCE_PORT: u16 = 47_113;"
          if (-not $text.Contains($old)) {
            throw "expected Fastpotify single-instance port marker was not found"
          }
          [IO.File]::WriteAllText($path, $text.Replace($old, "const INSTANCE_PORT: u16 = 47_114;"))
      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "fastpotify-proxy-${{ needs.sync.outputs.tag }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\fastpotify.exe" "$stage\fastpotify.exe"
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$stage.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: fastpotify-proxy-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Fastpotify Proxy · Linux x64 deb
    needs: sync
    if: needs.sync.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev cmake libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: proxy-linux-x64
      - name: Build Debian package
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-gnu

          version="${{ needs.sync.outputs.tag }}"
          version="${version#v}"
          root="$RUNNER_TEMP/fastpotify-deb"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
            "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/scalable/apps" dist

          install -m755 target/x86_64-unknown-linux-gnu/release/fastpotify "$root/usr/bin/fastpotify"
          install -m644 packaging/applications/fastpotify.desktop \
            "$root/usr/share/applications/fastpotify.desktop"
          install -m644 packaging/icons/fastpotify.svg \
            "$root/usr/share/icons/hicolor/scalable/apps/fastpotify.svg"

          cat > "$root/DEBIAN/control" <<EOF
          Package: fastpotify
          Version: $version
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: OthinusG
          Depends: libc6, libasound2, libpulse0, libxkbcommon0, libwayland-client0, libgl1, libx11-6, libxcursor1, libxi6, libxrandr2
          Description: Fastpotify Proxy native Spotify client with HTTP proxy support
           Downstream proxy-enabled build synchronized with upstream Fastpotify.
          EOF

          dpkg-deb --build --root-owner-group "$root" \
            "dist/fastpotify-proxy-${{ needs.sync.outputs.tag }}-linux-x64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: fastpotify-proxy-linux-x64-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish Fastpotify Proxy release
    needs: [sync, macos, windows, linux]
    if: ${{ needs.sync.outputs.release == 'true' && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Remove superseded and duplicate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.sync.outputs.tag }}"
          for asset in \
            "fastpotify-${tag}-macos-universal.dmg" \
            "fastpotify-${tag}-windows-x64.zip" \
            "fastpotify-${tag}-linux-x64.deb" \
            "fastpotify-proxy-${tag}-macos-universal.dmg" \
            "fastpotify-proxy-${tag}-windows-x64.zip" \
            "fastpotify-proxy-${tag}-linux-x64.deb" \
            "checksums.txt"; do
            gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: Fastpotify Proxy ${{ needs.sync.outputs.tag }}
          body: |
            Automatic proxy-enabled build synchronized with upstream Fastpotify.

            Included downloads:
            - Fastpotify Proxy macOS universal DMG (Apple Silicon + Intel)
            - Fastpotify Proxy Windows x64 ZIP
            - Fastpotify Proxy Linux x64 Debian package
          files: dist/*
