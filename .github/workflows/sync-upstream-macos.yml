name: Sync upstream and release macOS

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-macos
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: crmne/fastpotify

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.sync.outputs.release }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            # Stop before committing so downstream-only workflows can always be
            # restored before the merge commit is created. GitHub's Actions token
            # cannot push upstream workflow-file changes back to this repository.
            if ! git merge --no-commit --no-ff upstream/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"

              if [[ "$conflicts" != "flake.nix" ]]; then
                echo "::error::Upstream merge has conflicts that require manual resolution:"
                printf '%s\n' "$conflicts"
                git merge --abort
                exit 1
              fi

              ours="$(mktemp)"
              theirs="$(mktemp)"
              ours_normalized="$(mktemp)"
              theirs_normalized="$(mktemp)"
              trap 'rm -f "$ours" "$theirs" "$ours_normalized" "$theirs_normalized"' EXIT

              git show :2:flake.nix > "$ours"
              git show :3:flake.nix > "$theirs"

              sed -E 's#hash = "sha256-[^"]+";#hash = "__VENDOR_HASH__";#' \
                "$ours" > "$ours_normalized"
              sed -E 's#hash = "sha256-[^"]+";#hash = "__VENDOR_HASH__";#' \
                "$theirs" > "$theirs_normalized"

              if ! cmp -s "$ours_normalized" "$theirs_normalized"; then
                echo "::error::flake.nix differs beyond the Nix vendor hash; refusing automatic resolution."
                git merge --abort
                exit 1
              fi

              echo "flake.nix conflicts only in the Nix vendor hash; keeping the proxy fork value."
              git checkout --ours -- flake.nix
              git add flake.nix

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::Unresolved merge conflicts remain."
                git merge --abort
                exit 1
              fi
            fi

            # Keep this fork's CI/sync/release workflows. Upstream application
            # code is merged normally, but upstream workflow changes are ignored.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit --no-edit
          fi

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to read package version from Cargo.toml"
            exit 1
          fi
          tag="v${version}"

          # Always sync main first, even when this version already has a release.
          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A previous build may have created the version tag before release
            # publication failed. Reuse it so a rerun can finish the release.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: sync
    if: needs.sync.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: proxy-macos-universal

      - name: Build universal app
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/fastpotify \
            target/x86_64-apple-darwin/release/fastpotify \
            -output universal/fastpotify
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          bash packaging/macos/bundle.sh \
            universal/fastpotify Fastpotify.app "$version"

      - name: Package DMG
        run: |
          set -euo pipefail
          name="fastpotify-proxy-${{ needs.sync.outputs.tag }}-macos-universal"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          cp -R Fastpotify.app "$stage/"
          cp README.md LICENSE "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Fastpotify -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"
          shasum -a 256 dist/*.dmg > dist/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: Fastpotify Proxy ${{ needs.sync.outputs.tag }}
          body: Automatic macOS proxy build aligned with the corresponding upstream Fastpotify version.
          files: |
            dist/*.dmg
            dist/checksums.txt
